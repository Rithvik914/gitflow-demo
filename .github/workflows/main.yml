
name: Gitflow CI

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check repository
        run: |
          echo "Gitflow demo CI is running"
          ls -la
          test -f README.md
          echo "Repository check passed"
